name: vue-lara-clean-ecommerce

services:
  # 0. One-shot schema migration (first boot also seeds demo data), runs before API/workers start
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_migrate
    restart: "no"
    command:
      - sh
      - -c
      - |
        if php artisan migrate:status > /dev/null 2>&1; then
          php artisan migrate --force
        else
          php artisan migrate --force --seed
        fi
    environment:
      APP_ENV: "${APP_ENV:-local}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-ecommerce}"
      DB_USERNAME: "${DB_USERNAME:-ecommerce}"
      DB_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # 1. Decoupled Backend REST API (Laravel 13 + FrankenPHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_backend_api
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:80"
    environment:
      SERVER_NAME: ":80"
      APP_NAME: "CleanCommerce API"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "http://localhost:${BACKEND_PORT:-8080}"
      FRONTEND_URL: "http://localhost:${FRONTEND_PORT:-5173}"
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: "${DB_DATABASE:-ecommerce}"
      DB_USERNAME: "${DB_USERNAME:-ecommerce}"
      DB_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_KEY: "${MEILI_MASTER_KEY:-masterKeyCleanCommerce2026}"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SEPAY_WEBHOOK_SECRET: "${SEPAY_WEBHOOK_SECRET:-sepay_local_hmac_secret_2026}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-stripe_local_hmac_secret_2026}"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - ecommerce-net

  # 2. Decoupled Standalone Frontend SPA (Vue 3.5 + TypeScript + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ecom_frontend_spa
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}/api/v1"
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on:
      - backend
    networks:
      - ecommerce-net

  # 3. Async Domain Event & Notification Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_queue_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--queue=high,payments,search,default", "--sleep=1", "--tries=3", "--max-time=3600"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: "${DB_DATABASE:-ecommerce}"
      DB_USERNAME: "${DB_USERNAME:-ecommerce}"
      DB_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_KEY: "${MEILI_MASTER_KEY:-masterKeyCleanCommerce2026}"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # 4. Transactional Outbox Relay + Expired Stock Reservation Sweeper
  outbox-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecom_outbox_relay
    restart: unless-stopped
    command: ["php", "artisan", "outbox:relay", "--daemon", "--sleep-ms=500"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: 6432
      DB_DATABASE: "${DB_DATABASE:-ecommerce}"
      DB_USERNAME: "${DB_USERNAME:-ecommerce}"
      DB_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # 5. Primary ACID Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ecommerce}"
      POSTGRES_USER: "${DB_USERNAME:-ecommerce}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce} -d ${DB_DATABASE:-ecommerce}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # 6. Transaction Connection Pooler (High-Concurrency Flash-Sale Shield)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ecom_pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: "${DB_USERNAME:-ecommerce}"
      DB_PASSWORD: "${DB_PASSWORD:-ecommerce_secret}"
      DB_HOST: postgres
      DB_NAME: "${DB_DATABASE:-ecommerce}"
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 40
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # 7. Redis 7 (Cache, Atomic Locks, Queue Broker)
  redis:
    image: redis:7.4-alpine
    container_name: ecom_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # 8. Meilisearch (Sub-25ms Typo-Tolerant Product Search)
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: ecom_meilisearch
    restart: unless-stopped
    ports:
      - "${FORWARD_MEILI_PORT:-7700}:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-masterKeyCleanCommerce2026}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ecommerce-net

  # 9. Mailpit (Local Transactional Email UI)
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: ecom_mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - ecommerce-net

volumes:
  pgdata:
  redisdata:
  meilidata:
  backend_vendor:
  frontend_node_modules:

networks:
  ecommerce-net:
    driver: bridge
