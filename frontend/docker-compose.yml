name: cleancommerce-frontend

services:
  # Standalone Vue 3.5 + TypeScript SPA (Dev: Vite HMR :5173 | Prod target: Nginx :80)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: ecom_frontend_spa
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080/api/v1}"
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
    networks:
      - frontend-net

volumes:
  frontend_node_modules:

networks:
  frontend-net:
    name: cleancommerce-shared-net
    driver: bridge
